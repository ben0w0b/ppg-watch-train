; PPG Watch — Waveshare ESP32-S3-Touch-LCD-1.28 + SparkFun MAX30101/MAX32664
; 建置:  pio run            (預設環境 waveshare-s3-lcd128-pm)
; 燒錄:  pio run -t upload
; 監看:  pio device monitor
; 這份是 2026-10-29 從研究用 repo 抽出來的「目前燒在手錶上的版本」;研究用的實驗環境 (stress_bench 等) 沒有搬過來。

[platformio]
default_envs = waveshare-s3-lcd128-pm   ; 2026-09-11 起預設為 PM 版 (pioarduino hybrid,見檔尾);舊環境留作備援

; 手錶韌體 (基底環境:預編譯 Arduino 核心,沒有電源管理;備援用)
[env:waveshare-s3-lcd128]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 板上為 ESP32-S3R2:16MB Flash + 2MB QSPI PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    ; 本板透過 CH343P UART 燒錄/列印,不走 USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; 模型標頭 (tools/stress_model.h、har_forest.h、har_model.h) 在 tools/
    -I tools
    ; BLE (手機 app 操控,見 src/ble_link.h):只當周邊,關掉中央/觀察者角色省 RAM
    -DBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

monitor_speed = 921600
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

lib_deps =
    sparkfun/SparkFun Bio Sensor Hub Library
    lovyan03/LovyanGFX@^1.2.0
    h2zero/NimBLE-Arduino@^2.5.1

; WESAD 壓力模型的板端推論與比對。與手錶韌體共用板子設定,但只編譯 stress_bench.cpp。
;   uv run pio run -e stress_bench -t upload
; ---------- 路線 A:Arduino 當 ESP-IDF 元件重建 (pioarduino hybrid compile),開 ESP-IDF 電源管理 ----------
; 同一份程式碼,只是 Arduino 核心改從原始碼編譯 (Arduino 3.x / IDF 5.x),才能改 sdkconfig:
;   自動 light sleep (tickless idle)、動態調頻、BLE modem sleep。第一次建置要下載 IDF 與工具鏈,約 20–40 分鐘。
;   uv run pio run -e waveshare-s3-lcd128-pm -t upload
; 程式碼裡以 CONFIG_PM_ENABLE 分支:舊環境 (預編譯核心) 沒有這個巨集,行為完全不變。
[env:waveshare-s3-lcd128-pm]
extends = env:waveshare-s3-lcd128
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board_build.partitions = partitions_16MB.csv   ; hybrid 模式只找 IDF 目錄或專案相對路徑,所以複製一份進專案 (內容 = default_16MB.csv)
; 用不到的 IDF 受管元件不要進 hybrid 建置 (esp_insights / rainmaker 會因 embed 憑證檔而編譯失敗)
custom_component_remove =
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-modbus
    espressif/network_provisioning
    espressif/esp_modem
    espressif/lan867x
    chmorgan/esp-libhelix-mp3
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_PM_PROFILING=y
    CONFIG_PM_SLP_IRAM_OPT=n
    CONFIG_PM_RTOS_IDLE_OPT=n
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_PM_DFS_INIT_AUTO=y
    CONFIG_ESP_PHY_MAC_BB_PD=y
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
