# 自動建置設定工具 app (Android):push 到 main 或手動觸發 (Actions › Build app › Run workflow),Ubuntu 機器編 release APK。
# 產物在該次執行的 Artifacts:ppg-watch-tool-android.apk。(2026-10-29 使用者決定不做 iOS 版,iOS 的工作已拿掉。)
name: Build app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.35.2', cache: true }
      - run: flutter pub get
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ppg-watch-tool-android.apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
